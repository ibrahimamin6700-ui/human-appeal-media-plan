plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Dashboard UI is served live from the Apps Script deployment; this build syncs the Android wrapper with the current GitHub release flow.
def githubRun = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'com.humanappeal.mediaplan'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.humanappeal.mediaplan'
        minSdk 24
        targetSdk 35
        versionCode githubRun
        versionName "1.0.${githubRun}"
    }

    signingConfigs {
        release {
            if (keystoreFile && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
}
