name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Official release version, e.g. 1.1.0 (leave empty for a test build)'
        required: false
        default: ''
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RELEASE_VERSION: ${{ github.event.inputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Check release version
        if: env.RELEASE_VERSION != ''
        shell: bash
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must look like 1.1.0"
            exit 1
          fi
          if [ "$SIGNED_BUILD" != "true" ]; then
            echo "::error::Official releases need the signing secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "APP_VERSION_NAME=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        if: env.SIGNED_BUILD == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-app/humanappeal-release.jks"

      - name: Build signed release APK
        if: env.SIGNED_BUILD == 'true'
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android-app/humanappeal-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: humanappeal
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK until signing is configured
        if: env.SIGNED_BUILD != 'true'
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          if [ "$SIGNED_BUILD" = "true" ]; then
            cp android-app/app/build/outputs/apk/release/app-release.apk HEMERA.apk
          else
            cp android-app/app/build/outputs/apk/debug/app-debug.apk HEMERA.apk
          fi
          # Apps from before the rename look for SEKNA.apk in the release, so a copy goes up under that name too.
          cp HEMERA.apk SEKNA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEMERA-APK
          path: HEMERA.apk
          if-no-files-found: error

      # Only a manual run with a release_version publishes an official release.
      # HEMERA notifies the team about it automatically (Apps Script checks GitHub Releases).
      - name: Publish GitHub Release
        if: env.SIGNED_BUILD == 'true' && env.RELEASE_VERSION != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RELEASE_VERSION}"
          gh release create "$TAG" HEMERA.apk SEKNA.apk \
            --target "$GITHUB_SHA" \
            --title "HEMERA ${RELEASE_VERSION}" \
            --notes "HEMERA ${RELEASE_VERSION} for Android. Open HEMERA to install the update. Install HEMERA.apk." \
            --latest
